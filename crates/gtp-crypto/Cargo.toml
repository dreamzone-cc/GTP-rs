[package]
name = "gtp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GTP Packet Protection, AEAD (ChaCha20-Poly1305), HKDF Key Derivation, and Replay Defense"

[dependencies]
gtp-types = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false

[features]
default = ["std"]
std = ["gtp-types/std"]
