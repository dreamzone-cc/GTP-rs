[package]
name = "gtp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GTP Packet Protection, AEAD (ChaCha20-Poly1305), HKDF Key Derivation, and Replay Defense"

[dependencies]
gtp-types = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Self dev-dependency: enables `insecure-plaintext` for the integration tests
# (tests/ compile against the library WITHOUT cfg(test), so the feature gate
# for PlaintextProtector must be turned on explicitly here).
gtp-crypto = { path = ".", features = ["insecure-plaintext"] }

[[bench]]
name = "crypto_bench"
harness = false

[features]
default = ["std"]
std = ["gtp-types/std"]
# Null-cipher (PlaintextProtector) for benchmarking, fuzzing, and offline
# simulation ONLY. Off by default so production builds cannot accidentally
# ship a protector that disables confidentiality and integrity.
insecure-plaintext = []
