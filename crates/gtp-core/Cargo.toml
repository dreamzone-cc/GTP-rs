[package]
name = "gtp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
zeroize = { workspace = true }
gtp-types = { workspace = true }
gtp-wire = { workspace = true }
gtp-recovery = { workspace = true }
gtp-cc = { workspace = true }
gtp-scheduler = { workspace = true }
gtp-path = { workspace = true }
gtp-crypto = { workspace = true }
gtp-route = { workspace = true }
rustc-hash = { workspace = true }

[features]
default = ["std"]
std = [
    "gtp-types/std",
    "gtp-wire/std",
    "gtp-recovery/std",
    "gtp-cc/std",
    "gtp-scheduler/std",
    "gtp-path/std",
    "gtp-crypto/std",
]
# Passthrough: enables the null-cipher protector for simulation builds only.
insecure-plaintext = ["gtp-crypto/insecure-plaintext"]

[dev-dependencies]
# Tests exercise the plaintext protector paths; the feature is NEVER enabled for
# the production lib target (see state.rs gating).
gtp-crypto = { workspace = true, features = ["insecure-plaintext"] }
