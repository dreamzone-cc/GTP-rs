name: GTP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Workspace
        run: cargo check --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace

      - name: Run Clippy (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Formatting
        run: cargo fmt --check

      - name: Security Audit (cargo-audit)
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Documentation
        run: cargo doc --workspace --no-deps

      - name: Run Game Loop Example
        run: cargo run -p gtp --example sync_game_loop

      - name: Run Async Tokio Example
        run: cargo run -p gtp --example async_tokio_server

      - name: Run Deterministic Simulation Benchmark
        run: cargo run -p gtp-cli -- sim-benchmark --ticks 500

  fuzz_smoke:
    name: Fuzz smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # WIR-12: the `fuzz` package is deliberately kept OUT of the workspace
      # members (libfuzzer-sys needs nightly and would break the stable jobs),
      # which meant the fuzz targets were never built and could rot unnoticed.
      # This job builds and briefly runs them on every push instead.
      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Run decode_frame
        run: cargo +nightly fuzz run decode_frame -- -max_total_time=120

      - name: Run handshake_frames
        run: cargo +nightly fuzz run handshake_frames -- -max_total_time=120
