name: GTP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Workspace
        run: cargo check --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace

      - name: Run Clippy (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Formatting
        run: cargo fmt --check

      - name: Security Audit (cargo-audit)
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Documentation
        run: cargo doc --workspace --no-deps

      - name: Run Game Loop Example
        run: cargo run -p gtp --example sync_game_loop

      - name: Run Async Tokio Example
        run: cargo run -p gtp --example async_tokio_server

      - name: Run Deterministic Simulation Benchmark
        run: cargo run -p gtp-cli -- sim-benchmark --ticks 500
