[workspace]
members = [
    "crates/gtp-types",
    "crates/gtp-wire",
    "crates/gtp-recovery",
    "crates/gtp-cc",
    "crates/gtp-scheduler",
    "crates/gtp-path",
    "crates/gtp-route",
    "crates/gtp-crypto",
    "crates/gtp-core",
    "crates/gtp-io",
    "crates/gtp-runtime-tokio",
    "crates/gtp-sim",
    "crates/gtp-cli",
    "crates/gtp",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["GTP Engineering Team"]
license = "AGPL-3.0"

[workspace.dependencies]
gtp-types = { path = "crates/gtp-types" }
gtp-wire = { path = "crates/gtp-wire" }
gtp-recovery = { path = "crates/gtp-recovery" }
gtp-cc = { path = "crates/gtp-cc" }
gtp-scheduler = { path = "crates/gtp-scheduler" }
gtp-path = { path = "crates/gtp-path" }
gtp-route = { path = "crates/gtp-route" }
gtp-crypto = { path = "crates/gtp-crypto" }
gtp-core = { path = "crates/gtp-core" }
gtp-io = { path = "crates/gtp-io" }
gtp-runtime-tokio = { path = "crates/gtp-runtime-tokio" }
gtp-sim = { path = "crates/gtp-sim" }
gtp = { path = "crates/gtp" }

# Standard dependencies
bytes = "1.9"
socket2 = "0.5"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rustc-hash = "2.1"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
